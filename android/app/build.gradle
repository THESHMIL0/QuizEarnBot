apply plugin: 'com.android.application'

android {
    namespace 'com.quizearn.bot'
    compileSdk 33

    defaultConfig {
        applicationId "com.quizearn.bot"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
