name: Build Android Mobile APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Quiz & Earn Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Run Build and Capture Logs
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace > ../build_error_details.txt 2>&1 || true
          cat ../build_error_details.txt | tail -n 80

      - name: Publish Log or APK
        run: |
          echo "### Gradle Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 60 build_error_details.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" ./QuizEarnBot.apk
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase origin main || true
          git add build_error_details.txt QuizEarnBot.apk || true
          git commit -m "Auto-publish build artifacts [skip ci]" || echo "No changes"
          git push origin main || echo "Push complete"
