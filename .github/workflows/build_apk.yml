name: Build Android Mobile APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Quiz & Earn Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace > ../error_log.txt 2>&1 || true
          tail -n 60 ../error_log.txt

      - name: Check APK and Stage
        run: |
          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" ./QuizEarnBot.apk
            ls -lh QuizEarnBot.apk
          else
            echo "No APK found. Preparing error log."
          fi

      - name: Commit Files to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add QuizEarnBot.apk error_log.txt || true
          git commit -m "Auto-publish build artifacts [skip ci]" || echo "No changes"
          git push origin main || echo "Push complete"
