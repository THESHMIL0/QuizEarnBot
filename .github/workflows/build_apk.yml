name: Build Android Mobile APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Quiz & Earn Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Stage APK to Root
        run: |
          echo "Searching for generated APK files..."
          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" ./QuizEarnBot.apk
            ls -lh ./QuizEarnBot.apk
          else
            echo "No APK produced, checking build directory:"
            find android/ -type f || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizEarnBot-Mobile-APK
          path: QuizEarnBot.apk

      - name: Commit and Push APK to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add QuizEarnBot.apk
          git commit -m "Auto-publish QuizEarnBot.apk for direct web download [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed or already up to date"
