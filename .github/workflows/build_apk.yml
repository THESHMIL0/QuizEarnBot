name: Build Android Mobile APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Quiz & Earn Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleRelease --stacktrace

      - name: Stage APK to Root
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk QuizEarnBot.apk
          ls -lh QuizEarnBot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizEarnBot-Mobile-APK
          path: QuizEarnBot.apk

      - name: Commit and Push APK to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add QuizEarnBot.apk
          git commit -m "Auto-publish QuizEarnBot.apk for direct web download [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed or already up to date"
