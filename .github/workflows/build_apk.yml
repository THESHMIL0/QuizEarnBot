name: Build Android Mobile APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Quiz & Earn Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy Generated APK
        run: |
          mkdir -p release_apk
          find android/ -name "*.apk" -exec cp {} release_apk/QuizEarnBot.apk \;
          cp release_apk/QuizEarnBot.apk ./QuizEarnBot.apk
          ls -lh QuizEarnBot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizEarnBot-Mobile-APK
          path: QuizEarnBot.apk

      - name: Push APK to Main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git pull --rebase origin main || true
          git add QuizEarnBot.apk
          git commit -m "Publish QuizEarnBot.apk for 1-click web download [skip ci]" || echo "No changes"
          git push origin main || echo "Push failed"
